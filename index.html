/* ---------- Brand / Category filter view ---------- */
function detailView(kind) {
  const K = KINDS[kind], O = KINDS[K.other];
  return {
    title: K.Label,
    render(route) {
      const item = Store.get(kind, route.id);
      if (!item) return `<a class="back" href="#/${K.route}">${ic('back', 'sm')}${K.Plural}</a><div class="panel">${emptyBlock({ title: `This ${K.label} isn’t in your vault`, text: 'It may have been deleted or renamed on another device.', actions: `<a class="btn" href="#/${K.route}">See all ${K.plural}</a>` })}</div>`;
      const cars = Store.carsFor(kind, item.id), total = Store.state.cars.length;
      const breakdown = new Map();
      cars.forEach(c => breakdown.set(c[O.field], (breakdown.get(c[O.field]) || 0) + 1));
      const others = [...breakdown.entries()].map(([id, n]) => ({ item: Store.get(K.other, id), n })).sort((a, b) => b.n - a.n);
      return `<a class="back" href="#/${K.route}">${ic('back', 'sm')}${K.Plural}</a>
      <section class="tx-hero" style="--c:${item.color}">
        <div style="position:relative;z-index:1;min-width:0">
          <span class="tx-kind">${ic(K.icon, 'sm')}${K.Label}</span>
          <h1 class="tx-name display">${esc(item.name)}</h1>
          <p class="tx-sub">${cars.length ? `${pct(cars.length, total)}% of your vault, newest added ${fmtDate(cars.slice().sort(byNewest)[0].dateAdded)}.` : `No cars in this ${K.label} yet.`}</p>
        </div>
        <div class="tx-count"><b data-count="${cars.length}">${cars.length}</b><small>${cars.length === 1 ? 'car' : 'cars'} collected</small></div>
        <div class="tx-actions">
          <button class="btn btn-primary" data-action="add-car" data-${kind}="${item.id}">${ic('plus', 'sm')}Add car</button>
          <button class="btn" data-action="edit-tax" data-kind="${kind}" data-id="${item.id}">${ic('edit', 'sm')}Edit ${K.label}</button>
          <button class="btn btn-danger" data-action="delete-tax" data-kind="${kind}" data-id="${item.id}">${ic('trash', 'sm')}Delete</button>
        </div>
      </section>
      ${others.length ? `<section class="panel mt"><div class="panel-head"><div><h2>Across ${O.plural}</h2><p>How these cars split by ${O.label}</p></div></div>
        <div class="chips-row">${others.map(o => chip(K.other, o.item, `<span class="n">${o.n}</span>`)).join('')}</div></section>` : ''}
      ${cars.length ? `<div class="toolbar panel mt" role="search" style="grid-template-columns:1fr"><label class="search"><span class="sr-only">Search these cars</span>${ic('search', 'sm')}<input class="input" id="detail-q" type="search" placeholder="Search ${plural(cars.length, 'car')} from ${esc(item.name)}" value="${esc(UI.detailQ)}" autocomplete="off"></label></div>` : ''}
      <div id="detail-results" class="${cars.length ? '' : 'mt'}"></div>`;
    },
    mount(view, route) { this.results(view, route); },
    results(view = $('#view'), route = UI.route) {
      const box = $('#detail-results', view); if (!box) return;
      const item = Store.get(kind, route.id); if (!item) return;
      const cars = Store.carsFor(kind, item.id);
      if (!cars.length) { box.innerHTML = `<div class="panel">${emptyBlock({ title: `No cars from ${esc(item.name)} yet`, text: `Add a car and choose ${esc(item.name)} as its ${K.label}.`, actions: `<button class="btn btn-primary" data-action="add-car" data-${kind}="${item.id}">${ic('plus', 'sm')}Add car</button>` })}</div>`; return; }
      const list = sortCars(filterCars(cars, UI.detailQ), 'newest');
      box.innerHTML = list.length
        ? `<div class="results-meta"><span>Showing <b>${list.length}</b> of ${plural(cars.length, 'car')}</span></div>${carResults(list, { hide: kind })}`
        : `<div class="panel">${emptyBlock({ title: 'No matches', text: `No cars in ${esc(item.name)} match “${esc(UI.detailQ)}”.` })}</div>`;
    }
  };
}
Views.brand = detailView('brand');
Views.category = detailView('category');

/* =============================================================================
   Toasts
   ============================================================================= */
const Toast = {
  icons: { success: 'check', error: 'alert', info: 'info', warn: 'alert' },
  show(html, type = 'success', { action = null, duration = 4200 } = {}) {
    const el = document.createElement('div');
    el.className = `toast t-${type}`;
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.innerHTML = `<span class="t-ic">${ic(this.icons[type] || 'info', 'sm')}</span><span class="t-msg">${html}</span>${action ? `<button class="t-act">${esc(action.label)}</button>` : ''}<button class="t-x" aria-label="Dismiss">${ic('x', 'sm')}</button><span class="t-bar" style="animation-duration:${duration}ms"></span>`;
    $('#toasts').appendChild(el);
    while ($('#toasts').children.length > 4) $('#toasts').firstElementChild.remove();
    const kill = () => { if (el.dataset.dead) return; el.dataset.dead = '1'; el.classList.add('out'); setTimeout(() => el.remove(), 260); };
    const timer = setTimeout(kill, duration);
    el.querySelector('.t-x').onclick = kill;
    if (action) el.querySelector('.t-act').onclick = () => { clearTimeout(timer); kill(); action.run(); };
  }
};
const undoAction = (inverse, doneMsg) => ({ label: 'Undo', run: async () => { const r = await Store.commit(inverse); Toast.show(r.ok ? doneMsg : esc(r.error), r.ok ? 'info' : 'error'); } });

/* =============================================================================
   Modals
   ============================================================================= */
const Modal = {
  stack: [], seq: 0,
  open({ title, body, footer = '', size = '', onClose = null }) {
    const n = ++this.seq;
    const wrap = document.createElement('div');
    wrap.className = 'backdrop';
    wrap.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="mt-${n}">
      <div class="modal-head"><h2 class="modal-title" id="mt-${n}">${title}</h2><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
      <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
    $('#modal-root').appendChild(wrap);
    document.body.classList.add('modal-open');
    const prevFocus = document.activeElement;
    let closed = false;
    const api = {
      el: wrap.querySelector('.modal'), wrap,
      close: () => {
        if (closed) return; closed = true;
        this.stack = this.stack.filter(m => m !== api);
        wrap.classList.add('closing');
        setTimeout(() => wrap.remove(), 200);
        if (!this.stack.length) document.body.classList.remove('modal-open');
        if (prevFocus && prevFocus.isConnected) prevFocus.focus({ preventScroll: true });
        if (onClose) onClose();
      }
    };
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) api.close(); });
    wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) { e.preventDefault(); api.close(); } });
    this.stack.push(api);
    setTimeout(() => {
      const f = api.el.querySelector('[autofocus]') || api.el.querySelector('.modal-body input:not([type=hidden]):not([type=radio]):not([type=checkbox]), .modal-body select, .modal-body textarea') || api.el.querySelector('.modal-foot .btn-primary, .modal-foot .btn-danger-solid, .modal-foot .btn');
      if (f) f.focus({ preventScroll: true });
    }, 60);
    return api;
  },
  top() { return this.stack[this.stack.length - 1]; },
  closeAll() { [...this.stack].reverse().forEach(m => m.close()); }
};

function confirmDialog({ title, message, confirm = 'Confirm', danger = false }) {
  return new Promise(resolve => {
    let ok = false;
    const m = Modal.open({
      title, size: 'sm',
      body: `<div class="confirm ${danger ? 'is-danger' : ''}"><span class="confirm-ic">${ic(danger ? 'trash' : 'info')}</span><p>${message}</p></div>`,
      footer: `<button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" data-ok>${confirm}</button>`,
      onClose: () => resolve(ok)
    });
    m.el.querySelector('[data-ok]').onclick = () => { ok = true; m.close(); };
  });
}

function showErrors(form, errors) {
  $$('.field', form).forEach(f => { f.classList.remove('invalid'); const e = $('.err', f); if (e) e.textContent = ''; });
  let first = null;
  Object.entries(errors || {}).forEach(([k, msg]) => {
    const input = form.elements[k]; if (!input) return;
    const field = (input.length && !input.tagName ? input[0] : input).closest('.field'); if (!field) return;
    void field.offsetWidth; field.classList.add('invalid');
    const e = $('.err', field); if (e) e.textContent = msg;
    if (!first) first = input.length && !input.tagName ? input[0] : input;
  });
  if (first) first.focus();
}
function clearErrorOnInput(form) {
  form.addEventListener('input', e => { const f = e.target.closest('.field'); if (f) { f.classList.remove('invalid'); const er = $('.err', f); if (er) er.textContent = ''; } });
}

      title: 'One step first', size: 'sm',
      body: `<div class="confirm"><span class="confirm-ic">${ic('info')}</span><p>Every car needs a brand and a category. Create a ${missing} first, then add your car.</p></div>`,
      footer: `<button class="btn" data-close>Not now</button><button class="btn btn-primary" data-go>${ic('plus', 'sm')}Create a ${missing}</button>`
    });
    m.el.querySelector('[data-go]').onclick = () => { m.close(); openTaxForm(missing, null, () => openCarForm(null, preset)); };
    return;
  }
  const v = car ? { ...car } : { name: '', brandId: preset.brand || '', categoryId: preset.category || '', dateAdded: todayISO(), scale: '1:64', notes: '' };
  const options = (kind, sel) => Store.list(kind).slice().sort((a, b) => a.name.localeCompare(b.name))
    .map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const m = Modal.open({
    title: car ? 'Edit car' : 'Add a car',
    body: `<form id="car-form" class="form-grid" novalidate>
      <div class="field full"><label class="lbl" for="cf-name">Car name <small>Required</small></label>
        <input class="input" id="cf-name" name="name" maxlength="80" value="${esc(v.name)}" placeholder="e.g. Nissan Skyline GT-R (R34)" autocomplete="off"><div class="err"></div></div>
      <div class="field"><label class="lbl" for="cf-brand">Brand <small>Required</small></label>
        <select class="input" id="cf-brand" name="brandId"><option value="">Choose a brand</option>${options('brand', v.brandId)}<option value="__new">+ Create a new brand</option></select><div class="err"></div></div>
      <div class="field"><label class="lbl" for="cf-category">Category <small>Required</small></label>
        <select class="input" id="cf-category" name="categoryId"><option value="">Choose a category</option>${options('category', v.categoryId)}<option value="__new">+ Create a new category</option></select><div class="err"></div></div>
      <div class="field"><label class="lbl" for="cf-date">Date added <small>Required</small></label>
        <input class="input" type="date" id="cf-date" name="dateAdded" value="${esc(v.dateAdded)}" max="${todayISO()}"><div class="err"></div></div>
      <div class="field"><label class="lbl" for="cf-scale">Scale <small>Optional</small></label>
        <select class="input" id="cf-scale" name="scale"><option value="">Not set</option>${SCALES.map(x => `<option ${x === v.scale ? 'selected' : ''}>${x}</option>`).join('')}</select><div class="err"></div></div>
      <div class="field full"><label class="lbl" for="cf-notes">Notes <small id="cf-count">${(v.notes || '').length}/280</small></label>
        <textarea class="input" id="cf-notes" name="notes" maxlength="280" placeholder="Variant, packaging, where you found it…">${esc(v.notes)}</textarea><div class="err"></div></div>
    </form>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" type="submit" form="car-form">${ic('check', 'sm')}${car ? 'Save changes' : 'Add to vault'}</button>`
  });
  const form = $('#car-form', m.el);
  clearErrorOnInput(form);
  form.notes.addEventListener('input', () => { $('#cf-count', m.el).textContent = `${form.notes.value.length}/280`; });
  ['brand', 'category'].forEach(kind => {
    const sel = form[KINDS[kind].field];
    let last = sel.value;
    sel.addEventListener('change', () => {
      if (sel.value !== '__new') { last = sel.value; return; }
      sel.value = last;
      openTaxForm(kind, null, item => {
        const o = document.createElement('option'); o.value = item.id; o.textContent = item.name;
        sel.insertBefore(o, sel.lastElementChild); sel.value = item.id; last = item.id;
        sel.dispatchEvent(new Event('input', { bubbles: true }));
      });
    });
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const btn = m.el.querySelector('.modal-foot .btn-primary');
    btn.classList.add('loading');
    const res = await Store.saveCar(data, car ? car.id : null);
    btn.classList.remove('loading');

    if (!res.ok) return Toast.show(esc(res.error), 'error');
    m.close();
    Toast.show(car ? `Saved changes to <b>${esc(res.item.name)}</b>.` : `Added <b>${esc(res.item.name)}</b> to your vault.`, 'success',
      car ? {} : { action: { label: 'View', run: () => openCarView(res.item.id) } });
  });
}

async function deleteCarFlow(id) {

/* ---------- Brand / Category: create & edit ---------- */
function openTaxForm(kind, item = null, onSaved = null) {
  const K = KINDS[kind];
  const used = new Set(Store.list(kind).map(x => x.color));
  const color = item ? item.color : (PALETTE.find(p => !used.has(p.hex)) || PALETTE[Store.list(kind).length % PALETTE.length]).hex;
  const m = Modal.open({
    title: item ? `Edit ${K.label}` : `New ${K.label}`, size: 'sm',
    body: `<form id="tax-form" novalidate>
      <div class="field"><label class="lbl" for="tf-name">${K.Label} name <small>Required</small></label>
        <input class="input" id="tf-name" name="name" maxlength="40" value="${esc(item ? item.name : '')}" placeholder="${kind === 'brand' ? 'e.g. Hot Wheels' : 'e.g. JDM'}" autocomplete="off"><div class="err"></div></div>
      <div class="field" style="margin-top:18px"><span class="lbl">Colour <small>Used across charts and tags</small></span>
        <div class="swatches" role="radiogroup" aria-label="Colour">${PALETTE.map(p => `<label class="swatch" title="${p.name}"><input type="radio" name="color" value="${p.hex}" ${p.hex === color ? 'checked' : ''} aria-label="${p.name}"><span style="--c:${p.hex}"></span></label>`).join('')}</div><div class="err"></div></div>
      <div class="preview-chip">Preview <span id="tf-preview">${chip(kind, { id: '', name: item ? item.name : `New ${K.label}`, color })}</span></div>
    </form>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" type="submit" form="tax-form">${ic('check', 'sm')}${item ? 'Save changes' : `Create ${K.label}`}</button>`
  });
  const form = $('#tax-form', m.el);
  clearErrorOnInput(form);
  const preview = () => { const c = form.querySelector('[name=color]:checked'); $('#tf-preview', m.el).innerHTML = chip(kind, { id: '', name: norm(form.name.value) || `New ${K.label}`, color: c ? c.value : FALLBACK_COLOR }).replace('<a ', '<span ').replace('</a>', '</span>'); };
  preview();
  form.addEventListener('input', preview);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const c = form.querySelector('[name=color]:checked');
    const res = await Store.saveTax(kind, { name: form.name.value, color: c ? c.value : '' }, item ? item.id : null);
    if (res.errors) return showErrors(form, res.errors);

    m.close();
    Toast.show(item ? `Saved ${K.label} <b>${esc(res.item.name)}</b>.` : `Created ${K.label} <b>${esc(res.item.name)}</b>.`);
    if (onSaved) onSaved(res.item);
  });
}

/* ---------- Brand / Category: safe delete with reassignment ---------- */
async function deleteTaxFlow(kind, id) {
  const K = KINDS[kind];
  const item = Store.get(kind, id); if (!item) return;
  const linked = Store.carsFor(kind, id);
  const after = res => {
    if (!res.ok) return Toast.show(esc(res.error), 'error');
    if (UI.route.name === kind && UI.route.id === id) location.hash = `#/${K.route}`;
  };
  if (!linked.length) {
    const ok = await confirmDialog({ title: `Delete this ${K.label}?`, message: `<b>${esc(item.name)}</b> isn’t linked to any cars, so nothing else changes.`, confirm: `Delete ${K.label}`, danger: true });
    if (!ok) return;
    const res = await Store.deleteTax(kind, id);
    after(res);
    if (res.ok) Toast.show(`Deleted ${K.label} <b>${esc(item.name)}</b>.`, 'success', { action: undoAction(res.inverse, `Restored <b>${esc(item.name)}</b>.`), duration: 6000 });
    return;
  }
  const n = linked.length;
  const targets = () => Store.list(kind).filter(x => x.id !== id).sort((a, b) => a.name.localeCompare(b.name));
  const targetOptions = () => targets().map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  const m = Modal.open({
    title: `Delete ${esc(item.name)}?`,
    body: `<div class="warn-box">${ic('alert')}<div><b>${esc(item.name)} is linked to ${plural(n, 'car')}.</b>Choose what happens to ${n === 1 ? 'it' : 'them'} before this ${K.label} is deleted. Nothing changes until you confirm.</div></div>
      <div class="affected">${linked.slice(0, 6).map(c => `<span class="chip static" style="--c:${item.color}"><span class="t">${esc(c.name)}</span></span>`).join('')}${n > 6 ? `<span class="chip static"><span class="t">and ${n - 6} more</span></span>` : ''}</div>
      <form id="del-form">
        <label class="opt selected" data-opt="reassign"><input type="radio" name="strategy" value="reassign" checked>
          <span class="opt-body"><b>Move ${n === 1 ? 'the car' : `all ${n} cars`} to another ${K.label}</b><small>Recommended. Every car stays in your vault.</small>
          <span class="opt-extra" id="reassign-extra"></span></span></label>
        <label class="opt danger" data-opt="cascade"><input type="radio" name="strategy" value="cascade">
          <span class="opt-body"><b>Delete the ${K.label} and its ${plural(n, 'car')}</b><small>Removes ${n === 1 ? 'this car' : 'these cars'} from your vault as well.</small>
          <span class="opt-extra"><label class="check"><input type="checkbox" name="ack"> I understand ${plural(n, 'car')} will be deleted</label></span></span></label>
      </form>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-confirm>Confirm</button>`
  });
  const form = $('#del-form', m.el), btn = m.el.querySelector('[data-confirm]');
  const renderExtra = (sel = '') => {
    const box = $('#reassign-extra', m.el);
    box.innerHTML = targets().length
      ? `<label class="sr-only" for="del-target">Move to</label><select class="input" id="del-target" name="target"><option value="">Choose a ${K.label}</option>${targetOptions()}</select>`
      : `<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><small style="margin:0">There’s no other ${K.label} yet.</small><button type="button" class="btn" data-new>${ic('plus', 'sm')}Create one</button></span>`;
    if (sel && form.target) form.target.value = sel;
    const nb = box.querySelector('[data-new]');
    if (nb) nb.onclick = () => openTaxForm(kind, null, created => { renderExtra(created.id); sync(); });
    if (form.target) form.target.onchange = sync;
  };
  const sync = () => {
    const strat = form.strategy.value;
    $$('.opt', m.el).forEach(o => o.classList.toggle('selected', o.dataset.opt === strat));
    const target = form.target ? form.target.value : '';
    if (strat === 'reassign') {
      const t = target && Store.get(kind, target);
      btn.className = 'btn btn-primary';
      btn.innerHTML = `${ic('swap', 'sm')}${t ? `Move to ${esc(t.name)} and delete` : 'Move cars and delete'}`;
      btn.disabled = !t;
    } else {
      btn.className = 'btn btn-danger-solid';
      btn.innerHTML = `${ic('trash', 'sm')}Delete ${K.label} and ${plural(n, 'car')}`;
      btn.disabled = !form.ack.checked;
    }
  };
  renderExtra();
  form.addEventListener('change', sync);
  sync();
  btn.onclick = async () => {
    const strategy = form.strategy.value, targetId = form.target ? form.target.value : null;
    const t = targetId && Store.get(kind, targetId);
    btn.classList.add('loading');
    const res = await Store.deleteTax(kind, id, { strategy, targetId });
    btn.classList.remove('loading');
    if (!res.ok) return Toast.show(esc(res.error), 'error');
    m.close();
    after(res);
    Toast.show(strategy === 'reassign'
      ? `Moved ${plural(n, 'car')} to <b>${esc(t.name)}</b> and deleted <b>${esc(item.name)}</b>.`
      : `Deleted <b>${esc(item.name)}</b> and ${plural(n, 'car')}.`, 'success',
      { action: undoAction(res.inverse, `Restored <b>${esc(item.name)}</b> and its cars.`), duration: 7000 });
  };
}

];

function parseRoute() {
  const [name, id] = location.hash.replace(/^#\/?/, '').split('/');
  return { name: Views[name] ? name : 'dashboard', id: id ? decodeURIComponent(id) : null };
}

function renderChrome() {
  $$('[data-logo]').forEach(a => { a.innerHTML = `${logoSVG()}<span class="wordmark display">ADDiecastVault<small>Diecast collection manager</small></span>`; a.setAttribute('aria-label', 'ADDiecastVault dashboard'); });
  $('#side-nav').innerHTML = NAV.map(n => `<a href="#/${n.id}" data-nav="${n.id}" style="--nc:${n.c}" title="${n.label}">${ic(n.icon)}<span class="lbl">${n.label}</span>${n.count ? '<span class="count"></span>' : ''}</a>`).join('');
  $('#bottom-nav').innerHTML = NAV.map(n => `<a href="#/${n.id}" data-nav="${n.id}" style="--nc:${n.c}">${ic(n.icon)}<span>${n.short}</span></a>`).join('');
  $('#fab').innerHTML = ic('plus');
}

function updateChrome(route) {
  const active = { brand: 'brands', category: 'categories' }[route.name] || route.name;
  $$('[data-nav]').forEach(a => {
    const on = a.dataset.nav === active;
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    const n = NAV.find(x => x.id === a.dataset.nav), c = a.querySelector('.count');
    if (c && n.count) c.textContent = n.count();
  });
  const fb = Store.mode === 'firebase';
  const mem = Store.adapter && Store.adapter.memoryOnly;
  const sc = fb ? '#2EC4B6' : mem ? '#F2B544' : '#3CCB8B';
  $('#side-status').innerHTML = `<a class="status-card" href="#/settings" style="--sc:${sc}" title="Data source">
    <span class="s-ic">${ic(fb ? 'cloud' : 'db', 'sm')}</span>
    <span class="s-txt"><b><span class="live-dot"></span>${fb ? 'Synced with Firebase' : mem ? 'Temporary storage' : 'Saved on this device'}</b>
    <small>${fb ? 'Cloud Firestore' : mem ? 'Browser storage is blocked' : 'LocalStorage, works offline'}</small></span></a>`;
  $('#top-status').innerHTML = ic(fb ? 'cloud' : 'db');
  $('#top-status').style.color = sc;
  $('#top-theme').innerHTML = ic(document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun');
}

function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || a.closest('#modal-root')) return null;
  return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch { /* not a text input */ }
}

function render(animate = false) {
  const route = parseRoute();
  if (animate && (route.name !== UI.route.name || route.id !== UI.route.id)) UI.detailQ = '';
  UI.route = route;
  const def = Views[route.name];
  const view = $('#view');
  const focus = animate ? null : captureFocus();
  const scrollY = window.scrollY;
  view.innerHTML = def.render(route);
  if (def.mount) def.mount.call(def, view, route);
  view.classList.toggle('play', animate && !reducedMotion());
  $$('[data-count]', view).forEach(el => animateCount(el, +el.dataset.count, animate));
  updateChrome(route);
  if (animate) {
    view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
    window.scrollTo(0, 0);
  } else {
    window.scrollTo(0, scrollY);
    restoreFocus(focus);
  }
  const name = route.id && Store.get(route.name, route.id) ? Store.get(route.name, route.id).name : def.title;
  document.title = `${name} | ${APP.name}`;
}

function animateCount(el, to, animate) {
  if (!animate || reducedMotion() || !to) { el.textContent = to; return; }
  const dur = 1200, t0 = performance.now();
  el.textContent = '0';
  const step = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    el.textContent = Math.round(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function refreshResults() {
  const def = Views[UI.route.name];
  if (def && def.results) def.results.call(def, $('#view'), UI.route);
}

/* =============================================================================
   Theme & motion
   ============================================================================= */
const mqLight = matchMedia('(prefers-color-scheme: light)');
function applyTheme() {
  const t = Settings.data.theme;
  const resolved = t === 'system' ? (mqLight.matches ? 'light' : 'dark') : t;
  document.documentElement.dataset.theme = resolved;
  document.documentElement.dataset.motion = Settings.data.reduceMotion ? 'reduced' : 'full';
  const meta = $('meta[name="theme-color"]'); if (meta) meta.content = resolved === 'light' ? '#ECEFF5' : '#0D1220';
}
mqLight.addEventListener && mqLight.addEventListener('change', () => { if (Settings.data.theme === 'system') { applyTheme(); updateChrome(UI.route); } });

/* =============================================================================
   Data source switching, import / export
   ============================================================================= */
function readFirebaseForm() {
  const form = $('#fb-form'); if (!form) return null;
  const out = {};
  FIREBASE_FIELDS.forEach(([k]) => { out[k] = norm(form.elements[k].value); });
  return out;
}

async function switchMode(mode, btn) {
  if (mode === 'firebase') {
    const keys = readFirebaseForm();
    if (keys) Settings.save({ firebase: keys, migrate: $('#fb-migrate') ? $('#fb-migrate').checked : Settings.data.migrate });
    if (!FirebaseAdapter.isConfigured(Settings.firebaseConfig())) {
      Toast.show('Add your Firebase API key, auth domain, project ID and app ID, then connect.', 'warn', { duration: 6000 });
      const first = FIREBASE_FIELDS.map(([k]) => $(`#fb-${k}`)).find(i => i && !i.value);
      if (first) first.focus();
      return;
    }
  } else if (Store.mode === 'local') { return; }
  if (btn) btn.classList.add('loading');
  try {
    await Store.connect(mode, { seedFrom: mode === 'firebase' && Settings.data.migrate ? clone(Store.state) : null });
    Settings.save({ mode });
    Toast.show(mode === 'firebase' ? 'Connected. Your vault now syncs with Firebase.' : 'Switched to this device. Your vault is stored in LocalStorage.', 'success');
  } catch (err) {
    console.error(err);
    Toast.show(`Couldn’t connect to Firebase. ${esc(err.message || err)} Your vault stays on this device.`, 'error', { duration: 8000 });
  } finally { if (btn && btn.isConnected) btn.classList.remove('loading'); }
}

function exportData() {
  const payload = { app: APP.name, version: APP.version, exportedAt: new Date().toISOString(), ...clone(Store.state) };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `addiecastvault-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  Toast.show(`Exported ${plural(Store.state.cars.length, 'car')} to a backup file.`);
}

function normalizeImport(obj) {
  if (!obj || !Array.isArray(obj.brands) || !Array.isArray(obj.categories) || !Array.isArray(obj.cars)) throw new Error('This file isn’t an ADDiecastVault backup.');
  const dedupe = list => {
    const seen = new Map(), map = new Map(), out = [];
    list.forEach((x, i) => {
      if (!x || !x.id || !norm(x.name)) return;
      const k = nameKey(x.name);
      if (seen.has(k)) { map.set(String(x.id), seen.get(k)); return; }
      const item = { id: String(x.id), name: norm(x.name).slice(0, 40), color: isHex(x.color) ? x.color : PALETTE[i % PALETTE.length].hex, createdAt: x.createdAt || new Date().toISOString() };
      seen.set(k, item.id); map.set(item.id, item.id); out.push(item);
    });
    return { out, map };
  };
  const b = dedupe(obj.brands), c = dedupe(obj.categories);
  let skipped = 0;
  const cars = obj.cars.filter(x => {
    const ok = x && x.id && norm(x.name) && b.map.has(String(x.brandId)) && c.map.has(String(x.categoryId));
    if (!ok) skipped++;
    return ok;
  }).map(x => ({ ...x, id: String(x.id), name: norm(x.name).slice(0, 80), brandId: b.map.get(String(x.brandId)), categoryId: c.map.get(String(x.categoryId)), dateAdded: isISODate(x.dateAdded) ? x.dateAdded : todayISO(), scale: SCALES.includes(x.scale) ? x.scale : '', notes: String(x.notes || '').slice(0, 280) }));
  return { data: { brands: b.out, categories: c.out, cars }, skipped };
}

function importFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try { parsed = normalizeImport(JSON.parse(reader.result)); }
    catch (err) { return Toast.show(esc(err.message.includes('JSON') ? 'This file isn’t valid JSON.' : err.message), 'error'); }
    const { data, skipped } = parsed;
    const ok = await confirmDialog({
      title: 'Replace your vault?',
      message: `Import <b>${plural(data.cars.length, 'car')}</b>, ${plural(data.brands.length, 'brand')} and ${plural(data.categories.length, 'category', 'categories')} from <b>${esc(file.name)}</b>. This replaces everything currently in your vault.${skipped ? ` ${plural(skipped, 'car')} will be skipped because their brand or category is missing.` : ''}`,
      confirm: 'Import and replace'
    });
    if (!ok) return;
    const res = await Store.replaceAll(data);
    Toast.show(res.ok ? `Imported ${plural(data.cars.length, 'car')}.` : esc(res.error), res.ok ? 'success' : 'error');
  };
  reader.onerror = () => Toast.show('That file couldn’t be read.', 'error');
  reader.readAsText(file);
}

/* =============================================================================
   Actions (event delegation)
   ============================================================================= */
const Actions = {
  'add-car': el => openCarForm(null, { brand: el.dataset.brand, category: el.dataset.category }),
  'view-car': el => openCarView(el.dataset.id),
  'edit-car': el => { Modal.closeAll(); const c = Store.get('car', el.dataset.id); if (c) openCarForm(c); },
  'delete-car': el => deleteCarFlow(el.dataset.id),
  'go': el => { Modal.closeAll(); location.hash = `#/${el.dataset.to}`; },
  'add-tax': el => openTaxForm(el.dataset.kind),
  'edit-tax': el => { const x = Store.get(el.dataset.kind, el.dataset.id); if (x) openTaxForm(el.dataset.kind, x); },
  'delete-tax': el => deleteTaxFlow(el.dataset.kind, el.dataset.id),
  'clear-filters': () => {
    Object.assign(UI.filters, { q: '', brand: '', category: '' });
    const v = $('#view');
    if ($('#f-q', v)) { $('#f-q', v).value = ''; $('#f-brand', v).value = ''; $('#f-category', v).value = ''; }
    refreshResults();
  },
  'set-mode': el => switchMode(el.dataset.mode, el.classList.contains('btn') ? el : null),
  'save-fb': () => {
    const keys = readFirebaseForm();
    Settings.save({ firebase: keys, migrate: $('#fb-migrate').checked });
    Toast.show(FirebaseAdapter.isConfigured(Settings.firebaseConfig()) ? 'Firebase keys saved on this device.' : 'Keys saved. Fill in the remaining required fields to connect.', FirebaseAdapter.isConfigured(Settings.firebaseConfig()) ? 'success' : 'info');
  },
  'set-theme': el => { Settings.save({ theme: el.dataset.theme }); applyTheme(); render(false); },
  'toggle-theme': () => { Settings.save({ theme: document.documentElement.dataset.theme === 'light' ? 'dark' : 'light' }); applyTheme(); render(false); },
  'export': () => exportData(),
  'import': () => { const f = $('#import-file'); f.value = ''; f.click(); },
  'erase-all': async () => {
    const n = Store.state.cars.length;
    if (!(await confirmDialog({ title: 'Erase everything?', message: `This permanently deletes ${plural(n, 'car')}, every brand and every category from the current data source. Export a backup first if you might need it.`, confirm: 'Erase vault', danger: true }))) return;
    const res = await Store.replaceAll(emptyState());
    Toast.show(res.ok ? 'Your vault is now empty.' : esc(res.error), res.ok ? 'info' : 'error');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});

document.addEventListener('keydown', e => {
  const top = Modal.top();
  if (e.key === 'Escape' && top) { e.preventDefault(); top.close(); return; }
  if (e.key === 'Tab' && top) { // keep focus inside the open dialog
    const f = $$('button:not([disabled]), [href], input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', top.el).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.key === 'Enter' || e.key === ' ') && !typing) {
    const el = document.activeElement;
    if (el && el.dataset && el.dataset.action && !/^(BUTTON|A)$/.test(el.tagName)) { e.preventDefault(); el.click(); }
    return;
  }
  if (typing || top || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openCarForm(); }
  if (e.key === '/') {
    e.preventDefault();
    const s = $('#f-q') || $('#tax-q') || $('#detail-q');
    if (s) s.focus(); else { location.hash = '#/collection'; setTimeout(() => $('#f-q') && $('#f-q').focus(), 80); }
  }
});

const onSearch = debounce(() => refreshResults(), 110);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-q') { UI.filters.q = t.value; onSearch(); }
  else if (t.id === 'tax-q') { UI.taxQ[t.dataset.kind] = t.value; onSearch(); }
  else if (t.id === 'detail-q') { UI.detailQ = t.value; onSearch(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-brand') { UI.filters.brand = t.value; refreshResults(); }
  else if (t.id === 'f-category') { UI.filters.category = t.value; refreshResults(); }
  else if (t.id === 'f-sort') { UI.filters.sort = t.value; refreshResults(); }
  else if (t.id === 'set-motion') { Settings.save({ reduceMotion: t.checked }); applyTheme(); Toast.show(t.checked ? 'Motion reduced.' : 'Animations are back on.', 'info'); }
  else if (t.id === 'fb-migrate') { Settings.save({ migrate: t.checked }); }
  else if (t.id === 'import-file' && t.files && t.files[0]) importFile(t.files[0]);
});

/* =============================================================================
   7. Boot
   ============================================================================= */
async function boot() {
  Settings.load();
  applyTheme();
  renderChrome();
  const t0 = performance.now();
  let warn = null;
  try { await Store.connect(Settings.data.mode); }
  catch (err) {
    console.warn('Falling back to LocalStorage:', err);
    await Store.connect('local');
    warn = `Firebase couldn’t be reached, so your vault opened from this device. ${esc(err.message || err)}`;
  }
  if (Store.adapter.memoryOnly) warn = 'This browser blocks storage, so changes last only until you close the tab.';
  if (!location.hash) history.replaceState(null, '', '#/dashboard');
  Store.subscribe(() => render(false));
  window.addEventListener('hashchange', () => { Modal.closeAll(); render(true); });
  const wait = Math.max(0, 700 - (performance.now() - t0));
  setTimeout(() => {
    $('#splash').classList.add('hide');
    render(true);
    if (warn) setTimeout(() => Toast.show(warn, 'warn', { duration: 8000 }), 600);
  }, wait);
}
boot();
</script>
